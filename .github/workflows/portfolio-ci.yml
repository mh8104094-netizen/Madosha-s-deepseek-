name: Portfolio CI

on:
  push:
    branches: [main, portfolio-refresh]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall projects
      - name: Run tests
        run: python -m unittest discover -s projects -p 'test_*.py'
